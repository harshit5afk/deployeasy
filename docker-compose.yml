services:
  app:
    build:
      context: .
      args:
        GIT_SHA: local
    ports:
      - "8080:8080"
    volumes:
      - deployeasy_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/deployeasy.db
      - ENVIRONMENT=development
    env_file:
      - path: .env
        required: false

volumes:
  deployeasy_data:
