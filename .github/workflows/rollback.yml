name: rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA of the last good version"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # Pinned to v4.2.2 commit SHA for supply-chain security
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate SHA
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Enter the full 40-character lowercase commit SHA"; exit 1; }
      # Pinned to v3.3.0 commit SHA
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the image exists
        env:
          SHA: ${{ inputs.sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker manifest inspect "$IMAGE:$SHA" > /dev/null || { echo "::error::No image tagged $SHA in GHCR"; exit 1; }
      - name: Deploy the old image and verify
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          SHA: ${{ inputs.sha }}
        run: |
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          ./scripts/deploy_and_verify.sh
      - name: Reminder
        run: echo "::notice::Rollback done. Now open a revert or fix pull request so main no longer contains the bad code."
