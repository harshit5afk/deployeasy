name: rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA of the last good version"
        required: true
      deployment_id:
        description: "DeployEasy deployment record ID"
        required: false

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # Pinned to v4.2.2 commit SHA for supply-chain security
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate SHA
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Enter the full 40-character lowercase commit SHA"; exit 1; }
      # Pinned to v3.3.0 commit SHA
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the image exists
        env:
          SHA: ${{ inputs.sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker manifest inspect "$IMAGE:$SHA" > /dev/null || { echo "::error::No image tagged $SHA in GHCR"; exit 1; }
      - name: Deploy the old image and verify
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          SHA: ${{ inputs.sha }}
        run: |
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          ./scripts/deploy_and_verify.sh
      - name: Reminder
        run: echo "::notice::Rollback done. Now open a revert or fix pull request so main no longer contains the bad code."

  report-rollback:
    needs: rollback
    if: always() && inputs.deployment_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Report result to DeployEasy
        env:
          CALLBACK_URL: ${{ vars.DEPLOYEASY_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.DEPLOYEASY_CALLBACK_SECRET }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          SHA: ${{ inputs.sha }}
          RESULT: ${{ needs.rollback.result }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ -n "$CALLBACK_URL" && -n "$CALLBACK_SECRET" ]] || { echo "::error::Set DEPLOYEASY_CALLBACK_URL and DEPLOYEASY_CALLBACK_SECRET"; exit 1; }
          RESULT_JSON="failure"
          [[ "$RESULT" == "success" ]] && RESULT_JSON="success"
          BODY=$(jq -cn --argjson deployment_id "$DEPLOYMENT_ID" --arg commit_sha "$SHA" --arg repository "$REPOSITORY" --arg run_id "$RUN_ID" --arg result "$RESULT_JSON" '{deployment_id:$deployment_id,commit_sha:$commit_sha,repository:$repository,run_id:$run_id,result:$result}')
          SIGNATURE=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $2}')
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' -H "X-DeployEasy-Signature-256: sha256=$SIGNATURE" \
            --data "$BODY" "$CALLBACK_URL/api/webhooks/deployment-result"
