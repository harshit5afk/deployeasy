name: pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to v4.2.2 commit SHA for supply-chain security
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # full history so Gitleaks can scan past commits
      # Pinned to v5.3.0 commit SHA
      - uses: actions/setup-python@0b93645e9dc71a7c6b84287e0d4ea6eb713a4721 # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # Pinned to v2.3.8 commit SHA
      - uses: gitleaks/gitleaks-action@b67705139c9f4d76466f27918a3ea23ef855f7bc # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the image ONCE, scans that same image, and (main only) pushes that same image.
  build-scan-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build image once
        run: docker build --platform linux/amd64 --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" .
      - name: Scan that image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the same image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  deploy-and-verify:
    needs: build-scan-publish
    # Skipped until the Render service exists and SERVICE_URL is set (see README bootstrap)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SERVICE_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy and smoke test
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          SHA: ${{ github.sha }}
        run: |
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          ./scripts/deploy_and_verify.sh
