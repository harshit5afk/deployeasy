name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA to build and deploy"
        required: true
        type: string
      deployment_id:
        description: "DeployEasy deployment record ID (provided by DeployEasy)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to v4.2.2 commit SHA for supply-chain security
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history so Gitleaks can scan past commits
          ref: ${{ inputs.sha || github.sha }}
      - name: Report deployment start to DeployEasy
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_id != ''
        env:
          CALLBACK_URL: ${{ vars.DEPLOYEASY_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.DEPLOYEASY_CALLBACK_SECRET }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          TARGET_SHA: ${{ inputs.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ -n "$CALLBACK_URL" && -n "$CALLBACK_SECRET" ]] || { echo "::warning::Deployment start callback isn't configured"; exit 0; }
          PAYLOAD=$(jq -cn --arg deployment_id "$DEPLOYMENT_ID" --arg commit_sha "$TARGET_SHA" --arg repository "$REPOSITORY" --arg run_id "$RUN_ID" '{deployment_id:($deployment_id|tonumber),commit_sha:$commit_sha,repository:$repository,run_id:$run_id,result:"in_progress"}')
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" | awk '{print $NF}')
          curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            -H "X-DeployEasy-Signature-256: sha256=$SIGNATURE" \
            --data "$PAYLOAD" "${CALLBACK_URL%/}/api/webhooks/deployment-result"
      # Pinned to v5.3.0 commit SHA
      - uses: actions/setup-python@0b93645e9dc71a7c6b84287e0d4ea6eb713a4721 # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # Pinned to v2.3.8 commit SHA
      - uses: gitleaks/gitleaks-action@b67705139c9f4d76466f27918a3ea23ef855f7bc # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the image once, scans that same image, and publishes on main or manual dispatch.
  build-scan-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: Validate target SHA
        env:
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Target must be a full lowercase 40-character commit SHA"; exit 1; }
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
      - name: Set image name (must be lowercase)
        id: image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build image once
        run: docker build --platform linux/amd64 --build-arg GIT_SHA="$TARGET_SHA" -t "$IMAGE:$TARGET_SHA" .
      - name: Scan that image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.28.0
        with:
          image-ref: ${{ steps.image.outputs.image }}:${{ inputs.sha || github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the same image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          docker push "$IMAGE:$TARGET_SHA"
          docker tag "$IMAGE:$TARGET_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  deploy-and-verify:
    needs: build-scan-publish
    # Skipped until the Render service exists and SERVICE_URL is set (see README bootstrap)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SERVICE_URL != '') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy and smoke test
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          ./scripts/deploy_and_verify.sh

  report-deployment:
    needs: [test, build-scan-publish, deploy-and-verify]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.deployment_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send signed deployment result to DeployEasy
        env:
          CALLBACK_URL: ${{ vars.DEPLOYEASY_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.DEPLOYEASY_CALLBACK_SECRET }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          TARGET_SHA: ${{ inputs.sha }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build-scan-publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy-and-verify.result }}
        run: |
          set -euo pipefail
          [[ "$CALLBACK_URL" == https://* ]] || { echo "::error::Set DEPLOYEASY_CALLBACK_URL to the HTTPS callback endpoint"; exit 1; }
          [[ -n "$CALLBACK_SECRET" ]] || { echo "::error::Set DEPLOYEASY_CALLBACK_SECRET"; exit 1; }
          RESULT=success
          [[ "$TEST_RESULT" == success && "$BUILD_RESULT" == success && "$DEPLOY_RESULT" == success ]] || RESULT=failure
          PAYLOAD=$(jq -cn \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg commit_sha "$TARGET_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg result "$RESULT" \
            '{deployment_id:($deployment_id|tonumber),commit_sha:$commit_sha,repository:$repository,run_id:$run_id,result:$result}')
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" | awk '{print $NF}')
          curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            -H "X-DeployEasy-Signature-256: sha256=$SIGNATURE" \
            --data "$PAYLOAD" "${CALLBACK_URL%/}/api/webhooks/deployment-result"
